{% extends "dashboard/base.html" %}
{% block content %}
<h1 class="text-2xl font-bold text-pine-900">পাসওয়ার্ড পরিবর্তন</h1>
<form method="post" class="card mt-6 max-w-xl space-y-4">
  {% csrf_token %}
  {% for field in form %}{% include "dashboard/includes/field.html" with field=field %}{% endfor %}
  <button class="btn-primary" type="submit">সংরক্ষণ</button>
</form>
{% endblock %}
