<div>
  {% if field.field.widget.input_type != "checkbox" %}
    <label class="mb-1 block text-sm font-medium text-slate-800" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% endif %}
  <div class="{% if field.field.widget.input_type == 'checkbox' %}flex items-center gap-2{% endif %}">
    {{ field }}
    {% if field.field.widget.input_type == "checkbox" %}
      <label class="text-sm font-medium text-slate-800" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {% endif %}
  </div>
  {% if field.help_text %}<p id="{{ field.auto_id }}_helptext" class="mt-1 text-sm text-slate-600">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="mt-1 text-sm text-red-700">{{ error }}</p>{% endfor %}
</div>
