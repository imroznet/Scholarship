{% if messages %}
  <div class="no-print mb-4 space-y-2">
    {% for message in messages %}
      <p class="rounded-md border px-3 py-2 text-sm {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% else %}border-pine-200 bg-pine-50 text-pine-900{% endif %}">{{ message }}</p>
    {% endfor %}
  </div>
{% endif %}
