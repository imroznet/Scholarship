{% extends "dashboard/base.html" %}
{% block content %}
<div class="flex items-center justify-between"><h1 class="text-2xl font-bold text-pine-900">বিভাগ ব্যবস্থাপনা</h1><a class="btn-primary" href="{% url 'institutes:category_create' %}">বিভাগ যোগ</a></div>
<div class="table-wrap mt-6"><table class="data-table"><thead><tr><th>নাম</th><th>কোড</th><th>অবস্থা</th><th></th></tr></thead>
<tbody>{% for category in categories %}<tr><td>{{ category.name_bn }}</td><td class="font-latin">{{ category.code }}</td><td>{% if category.is_active %}সক্রিয়{% else %}নিষ্ক্রিয়{% endif %}</td><td><a class="underline" href="{% url 'institutes:category_edit' category.pk %}">সম্পাদনা</a></td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
