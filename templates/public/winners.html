{% extends "public/base.html" %}
{% block title %}বিজয়ী{% endblock %}
{% block content %}
<section class="mx-auto max-w-6xl px-4 py-10">
  <h1 class="text-[1.7rem] font-bold text-pine-900 sm:text-[2rem]">প্রকাশিত বিজয়ী</h1>
  <div class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
    {% for winner in winners %}
      {% include "public/includes/winner_card.html" %}
    {% empty %}
      <p class="text-[17px]">এখনো কোনো বিজয়ী প্রকাশ করা হয়নি।</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
