{% extends "dashboard/base.html" %}
{% block content %}
<h1 class="text-2xl font-bold text-pine-900">ফলাফল ব্যবস্থাপনা</h1>
<div class="table-wrap mt-6"><table class="data-table"><thead><tr><th>পরীক্ষা</th><th>শ্রেণি</th><th></th></tr></thead>
<tbody>{% for exam in exams %}<tr><td>{{ exam.name_bn }}</td><td>{{ exam.academic_class.name_bn }}</td><td><a class="underline" href="{% url 'results:entry' exam.pk %}">নম্বর দিন</a></td></tr>{% empty %}<tr><td colspan="3">আগে পরীক্ষা তৈরি করুন।</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
